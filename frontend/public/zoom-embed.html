<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zoom meeting embed</title>
    <style>
      html, body {
        margin: 0; height: 100%; background: #0b0f19; overflow: hidden;
      }
      #zoom-root { height: 100vh; width: 100%; background: #0b0f19; }
      #zoom-err {
        display: none; color: #fff; font: 13px/1.5 system-ui, sans-serif;
        padding: 24px; text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="zoom-root"></div>
    <div id="zoom-err"></div>
    <!-- Zoom Meeting SDK exactly as Zoom ships it: plain UMD <script>s in a
         React-free document. The SDK pins React 18 (the app is on React 19),
         so matching React 18 UMD globals load first and the SDK attaches
         window.ReactWidgets. All files are vendored into /zoom-sdk/ by
         `npm run build:zoom-embed` (runs with every build) — identical paths
         in dev (public/) and production (dist/). -->
    <script src="/zoom-sdk/react.production.min.js"></script>
    <script src="/zoom-sdk/react-dom.production.min.js"></script>
    <script src="/zoom-sdk/zoomus-websdk-embedded.umd.min.js"></script>
    <script>
      (function () {
        function report(msg) {
          // NOTE: must keep working AFTER boot — the join itself can fail
          // later (e.g. "Already has other meetings in progress"), and a
          // swallowed error leaves the parent stuck until its timeout.
          window.__zoomEmbedBoot = true;
          window.__zoomReported = true;
          var el = document.getElementById("zoom-err");
          if (el) {
            el.style.display = "block";
            el.textContent = msg;
          }
          parent.postMessage({ zoomEmbedError: msg }, "*");
        }
        function ready() {
          window.__zoomEmbedBoot = true;
          parent.postMessage({ zoomEmbedReady: true }, "*");
        }
        try {
          var NS =
            window.ReactWidgets ||
            window.ZoomMtgEmbedded ||
            window.ZoomMtg;
          if (!NS || typeof NS.createClient !== "function") {
            report(
              "Zoom SDK failed to initialise (React=" +
                !!window.React +
                " ReactDOM=" +
                !!window.ReactDOM +
                " SDK=" +
                !!NS +
                ") — re-run npm run build:zoom-embed and hard-refresh",
            );
            return;
          }
          var client = NS.createClient();
          var joining = false;
          var joined = false;
          var leaving = false;

          /* Leave the meeting (once) and tell the parent it is safe to drop
             this iframe. Zoom keeps the account "inside" a room whose iframe
             vanished before the SDK left, which makes the next join fail with
             "Already has other meetings in progress".

             With `end` set the HOST also terminates the meeting instead of
             just leaving it. A finished Zoom meeting otherwise stays
             "started" for its whole scheduled duration (60 min) and blocks
             every other interview hosted by the same account. Ending it frees
             the account immediately. Attendees (role 0) cannot end it, so
             they just leave. */
          function leaveMeeting(end) {
            if (leaving) {
              parent.postMessage({ zoomLeft: true }, "*");
              return;
            }
            leaving = true;
            joined = false;
            function done() {
              parent.postMessage({ zoomLeft: true }, "*");
            }
            var isHost = false;
            try {
              isHost = typeof client.isHost === "function" && client.isHost();
            } catch (e) {
              /* host state not ready — treat as attendee */
            }
            try {
              var p =
                end && isHost && typeof client.endMeeting === "function"
                  ? client.endMeeting()
                  : client.leaveMeeting();
              if (p && typeof p.then === "function") p.then(done, done);
              else done();
            } catch (e) {
              done();
            }
          }

          /* -------- toolbar helpers (the SDK's own buttons are the only
             public way to toggle the camera / open audio settings) -------- */
          function labelOf(el) {
            if (!el) return "";
            var attr =
              (el.getAttribute &&
                (el.getAttribute("title") || el.getAttribute("aria-label"))) ||
              "";
            var text = el.innerText || el.textContent || "";
            return String(attr || text).replace(/\s+/g, " ").trim();
          }
          function isVisible(el) {
            if (!el || !el.isConnected) return false;
            var rects = el.getClientRects && el.getClientRects();
            if (!rects || rects.length === 0) return false;
            try {
              var style = window.getComputedStyle(el);
              if (style.visibility === "hidden" || style.display === "none") return false;
              if (style.opacity === "0") return false;
            } catch (e) {
              /* assume visible */
            }
            return true;
          }
          function findToolbarButton(re) {
            // Match title / aria-label first (stable across locales we ship),
            // then visible text so a toolbar rendered without titles (or a
            // menu item like More → Settings) is still reachable.
            var sels = [
              "button[title]",
              "button[aria-label]",
              'button,[role="button"],[role="menuitem"],a[title],a[aria-label]',
            ];
            for (var s = 0; s < sels.length; s++) {
              var nodes = document.querySelectorAll(sels[s]);
              for (var i = 0; i < nodes.length; i++) {
                var label = labelOf(nodes[i]);
                // Long labels are containers, not controls.
                if (label && label.length <= 48 && re.test(label) && isVisible(nodes[i])) {
                  return nodes[i];
                }
              }
            }
            return null;
          }
          function clickToolbarButton(re) {
            var btn = findToolbarButton(re);
            if (!btn) return false;
            try {
              btn.click();
            } catch (e) {
              return false;
            }
            return true;
          }
          function clickFirstToolbar(res) {
            for (var i = 0; i < res.length; i++) {
              if (clickToolbarButton(res[i])) return res[i];
            }
            return null;
          }

          /* -------- audio settings --------
             There is no single "Audio Settings" toolbar button in the
             embedded SDK. Depending on build/state the entry point is one of:
               · a direct "Audio" toolbar button (older builds),
               · More → Settings → Audio tab (most builds), or
               · "Join Audio" when computer audio hasn't been joined yet. */
          function openAudioNotice() {
            parent.postMessage(
              {
                zoomNotice:
                  "Couldn't open Zoom's audio menu automatically — use the More menu in the meeting toolbar, then Settings → Audio.",
              },
              "*",
            );
          }
          function openAudioMenu(attempt) {
            attempt = attempt || 0;
            // 1) Direct audio button / already-open audio panel.
            if (clickFirstToolbar([/^audio$/i, /^audio settings$/i])) return;
            // 2) More → Settings → Audio.
            if (clickFirstToolbar([/^more( options)?$/i])) {
              setTimeout(function () {
                if (!clickFirstToolbar([/^settings$/i, /^meeting settings$/i])) {
                  if (attempt < 2) return openAudioMenu(attempt + 1);
                  return openAudioNotice();
                }
                setTimeout(function () {
                  if (
                    clickFirstToolbar([
                      /^audio$/i,
                      /^audio settings$/i,
                      /^speaker & microphone$/i,
                    ])
                  ) {
                    return;
                  }
                  if (attempt < 2) return openAudioMenu(attempt + 1);
                  openAudioNotice();
                }, 500);
              }, 450);
              return;
            }
            // 3) Audio not joined yet — join it, then re-run the menu route.
            if (
              attempt === 0 &&
              clickFirstToolbar([
                /^join audio$/i,
                /^join with computer audio$/i,
                /^computer audio$/i,
              ])
            ) {
              setTimeout(function () {
                openAudioMenu(attempt + 1);
              }, 1000);
              return;
            }
            openAudioNotice();
          }

          /* -------- state reporting -------- */
          function postSelfState() {
            var out = {};
            try {
              var u = client.getCurrentUser && client.getCurrentUser();
              if (u) {
                if (typeof u.muted === "boolean") out.muted = u.muted;
                if (typeof u.video === "boolean") out.videoOn = u.video;
                else if (typeof u.bVideoOn === "boolean") out.videoOn = u.bVideoOn;
              }
            } catch (e) {
              /* state not ready yet */
            }
            if (out.muted !== undefined || out.videoOn !== undefined) {
              parent.postMessage({ zoomSelfState: out }, "*");
            }
          }

          // Report camera state so the parent popup can nudge HR when all
          // video is off (an all-black stage means no feeds, not a bug).
          function reportVideo(users) {
            try {
              var list = Array.isArray(users)
                ? users
                : users && users.users
                  ? users.users
                  : [users];
              var anyOn = list.some(function (u) {
                return (
                  !!u &&
                  (u.bVideoOn === true ||
                    u.videoOn === true ||
                    u.isVideoOn === true)
                );
              });
              parent.postMessage({ zoomVideoOn: anyOn }, "*");
            } catch (e) {
              /* ignore */
            }
          }

          /* -------- meeting chat bridge -------- */
          // Rolling transcript so a late-opening chat drawer can ask for the
          // backlog (the SDK only emits messages live, no history API).
          var chatHistory = [];
          function normalizeChat(payload) {
            if (!payload || typeof payload !== "object") return null;
            var raw = payload.message;
            var text = Array.isArray(raw) ? raw.join(" ") : typeof raw === "string" ? raw : "";
            text = text.trim();
            if (!text) return null;
            var senderObj = payload.sender || {};
            var sender = senderObj.name || senderObj.displayName || "Participant";
            var userId = typeof senderObj.userId === "number" ? senderObj.userId : null;
            var time = typeof payload.timestamp === "number" ? payload.timestamp : Date.now();
            var id = payload.id
              ? String(payload.id)
              : (userId == null ? "p" : userId) + ":" + time + ":" + text.slice(0, 32);
            return { id: id, sender: sender, userId: userId, text: text, time: time };
          }
          function pushChat(entry) {
            if (!entry) return;
            for (var i = 0; i < chatHistory.length; i++) {
              if (chatHistory[i].id === entry.id) return; // duplicate echo
            }
            chatHistory.push(entry);
            if (chatHistory.length > 300) chatHistory.shift();
            parent.postMessage({ zoomChatMessage: entry }, "*");
          }

          try {
            if (typeof client.on === "function") {
              client.on("user-added", function (p) {
                reportVideo(p);
                postSelfState();
              });
              client.on("user-updated", function (p) {
                reportVideo(p);
                postSelfState();
              });
              client.on("chat-on-message", function (p) {
                pushChat(normalizeChat(p));
              });
            }
          } catch (e) {
            /* older SDK without events — parent simply never gets the hints */
          }

          /* -------- join failure watchdog --------
             The SDK can render a join refusal in its own UI WITHOUT rejecting
             the client.join() promise (e.g. "Fail to join the meeting. Already
             has other meetings in progress."). When that happens the parent
             only sees its own timeout and never learns the real reason, so it
             cannot retry as a participant. Watch the rendered text and report
             the refusal as soon as Zoom shows it. */
          var JOIN_FAIL_RE =
            /already has other meetings? in progress|other meetings? in progress|meeting has not started|has not started the meeting|wait for the host|waiting for the host|invalid meeting|meeting (?:does not exist|has been deleted|is invalid|not found)|not a valid meeting|meeting is full|invalid signature|signature (?:is )?(?:invalid|expired)/i;
          function watchJoinFailure() {
            var deadline = Date.now() + 45000;
            var timer = setInterval(function () {
              if (joined || leaving || window.__zoomReported || Date.now() > deadline) {
                clearInterval(timer);
                return;
              }
              var text = "";
              try {
                text = (document.body && document.body.innerText) || "";
              } catch (e) {
                /* ignore */
              }
              var match = JOIN_FAIL_RE.exec(text);
              if (match) {
                clearInterval(timer);
                report("Zoom join failed: " + match[0]);
              }
            }, 700);
          }

          /* -------- join + control command handling -------- */
          function handleCommand(d) {
            var cmd = d.command;
            if (cmd === "request-state") {
              postSelfState();
              parent.postMessage({ zoomChatHistory: chatHistory }, "*");
              return;
            }
            if (cmd === "mute") {
              try {
                client.mute(!!d.value);
                setTimeout(postSelfState, 500);
                setTimeout(postSelfState, 2000);
              } catch (e) {
                parent.postMessage(
                  {
                    zoomNotice:
                      "Could not change the microphone — try the mic button in the meeting toolbar.",
                  },
                  "*",
                );
              }
              return;
            }
            if (cmd === "video") {
              var wantOn = !!d.value;
              var clicked = clickToolbarButton(wantOn ? /^start video$/i : /^stop video$/i);
              if (clicked) {
                setTimeout(postSelfState, 900);
                setTimeout(postSelfState, 3500);
              } else {
                parent.postMessage(
                  {
                    zoomNotice:
                      "The meeting's video button isn't available yet — give the meeting a moment, then try again.",
                  },
                  "*",
                );
              }
              return;
            }
            if (cmd === "open-audio") {
              openAudioMenu(0);
              return;
            }
            if (cmd === "chat-send") {
              var text = String((d.text || "")).trim();
              if (!text) return;
              try {
                var res = client.sendChat(text);
                if (res && typeof res.then === "function") {
                  res
                    .then(function (msg) {
                      var entry = normalizeChat(msg);
                      if (!entry) {
                        entry = {
                          id: "self-" + Date.now(),
                          sender: "You",
                          userId: null,
                          text: text,
                          time: Date.now(),
                        };
                      }
                      entry.self = true;
                      pushChat(entry);
                    })
                    .catch(function (err) {
                      parent.postMessage(
                        {
                          zoomChatError:
                            "Could not send the message — in-meeting chat may be disabled (" +
                            String((err && (err.reason || err.message)) || err) +
                            ").",
                        },
                        "*",
                      );
                    });
                }
              } catch (e) {
                parent.postMessage(
                  {
                    zoomChatError:
                      "Could not send the message — in-meeting chat may be disabled.",
                  },
                  "*",
                );
              }
              return;
            }
            if (cmd === "chat-history") {
              parent.postMessage({ zoomChatHistory: chatHistory }, "*");
              return;
            }
          }

          window.addEventListener("message", function (ev) {
            var d = ev.data || {};
            if (!d || typeof d !== "object") return;
            if (d.type === "zoom-leave") {
              leaveMeeting(d.end === true);
              return;
            }
            if (d.type === "zoom-command") {
              handleCommand(d);
              return;
            }
            if (d.type !== "zoom-join") return;
            // Guard against a double join: the parent may retry with a fresh
            // iframe, but a duplicate join in THIS document would occupy a
            // second meeting slot on the account.
            if (joining || joined) return;
            joining = true;
            var root = document.getElementById("zoom-root");
            if (!root) {
              report("Zoom embed page missing #zoom-root.");
              return;
            }
            // Size the video stage to this iframe, which the parent already holds at
            // 16:9. Using the real window size (instead of a hardcoded
            // 800x450) means the meeting fills the pane at any window size.
            // The SDK lays out (and subtracts) its own toolbar internally, so
            // the full iframe box is what it should be told to fill.
            var w = Math.max(320, Math.round(window.innerWidth));
            var h = Math.max(200, Math.round(window.innerHeight));
            watchJoinFailure();
            client
              .init({
                zoomAppRoot: root,
                language: "en-US",
                patchJsMedia: true,
                leaveOnPageUnload: true,
                customize: {
                  video: {
                    // Auto-resize with the pane: without it the stage is
                    // user-draggable and can drift away from the container.
                    isResizable: false,
                    // Start with the local camera ON so HR sees their own
                    // preview immediately instead of a black name tile.
                    // The toolbar Start/Stop Video button still toggles it.
                    defaultCameraOn: true,
                    // Size BOTH layouts to the pane: with one participant the
                    // SDK uses the ribbon filmstrip, with more it uses the
                    // default (gallery/speaker) stage.
                    viewSizes: {
                      ribbon: { width: w, height: h },
                      default: { width: w, height: h },
                    },
                    defaultViewType: "speaker",
                  },
                },
              })
              .then(function () {
                return client.join({
                  sdkKey: String(d.sdkKey || ""),
                  signature: String(d.signature || ""),
                  meetingNumber: String(d.meetingNumber || ""),
                  password: String(d.password || ""),
                  userName: String(d.userName || "HR Interviewer"),
                });
              })
              .then(function () {
                // Force speaker view deterministically: defaultViewType is
                // only a boot hint and the SDK sometimes still lands in the
                // narrow ribbon filmstrip. Speaker fills the pane; HR can
                // still switch via the toolbar View button.
                try {
                  if (typeof client.setViewType === "function") {
                    client.setViewType("speaker");
                  }
                } catch (e) {
                  /* view toggle unavailable — keep whatever booted */
                }
                // Publish the local camera right after join (browser already
                // granted permission — the iframe allow="camera; microphone"
                // attribute carries it through). Without this the stage stays
                // a black name tile until HR finds Start Video themselves.
                // Skipped only when the parent explicitly opts out.
                if (d.startVideo !== false) {
                  var tries = 0;
                  var tryStartVideo = function () {
                    tries++;
                    if (clickToolbarButton(/^start video$/i)) {
                      parent.postMessage({ zoomVideoOn: true }, "*");
                      setTimeout(postSelfState, 1500);
                      setTimeout(postSelfState, 4500);
                      return;
                    }
                    if (tries < 15) {
                      setTimeout(tryStartVideo, 400);
                      return;
                    }
                    parent.postMessage(
                      {
                        zoomVideoHint:
                          "Camera is allowed but the meeting's Start Video button never appeared — click Start Video in the toolbar.",
                      },
                      "*",
                    );
                  };
                  setTimeout(tryStartVideo, 300);
                }
                setTimeout(postSelfState, 800);
                setTimeout(postSelfState, 3000);
                joined = true;
                joining = false;
                parent.postMessage({ zoomEmbedJoined: true }, "*");
              })
              .catch(function (e) {
                joining = false;
                report(
                  "Zoom join failed: " +
                    String((e && (e.reason || e.message)) || e),
                );
              });
          });
          // An iframe removed from the page is destroyed without firing
          // `beforeunload`; `pagehide`/`unload` do fire, so leave on all of
          // them. leaveOnPageUnload also covers the SDK's own hooks.
          ["pagehide", "unload", "beforeunload"].forEach(function (evt) {
            window.addEventListener(evt, function () {
              try {
                leaveMeeting(true);
              } catch (e) {
                /* ignore */
              }
            });
          });
          ready();
        } catch (e) {
          report(
            "Zoom embed failed to boot: " + String((e && e.message) || e),
          );
        }
      })();
    </script>
  </body>
</html>
